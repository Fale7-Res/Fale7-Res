name: Generate menu previews

on:
  push:
    branches: [main]
    paths:
      - data/menu.json
      - svgEdits.js
      - tools/generate-previews.js
      - tools/syncIndexHtml.js
      - public/menu-images.js
  workflow_dispatch:

concurrency:
  group: menu-previews-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Fonts
        run: |
          mkdir -p ~/.local/share/fonts
          cp .fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f -v
      - run: npm install --no-audit --no-fund
      - name: Generate and publish previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node tools/generate-previews.js
            node tools/syncIndexHtml.js
            git add -A -- previews data/menu.json public/index.html
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "generate updated menu previews"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not publish menu previews after 5 attempts" >&2
          exit 1

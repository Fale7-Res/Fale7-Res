name: Generate menu previews

on:
  push:
    branches: [main]
    paths:
      - data/menu.json
      - uploads/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Fonts
        run: |
          mkdir -p ~/.local/share/fonts
          cp .fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f -v
      - run: npm install --no-audit --no-fund
      - run: node tools/generate-previews.js
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews data/menu.json
          git diff --cached --quiet || git commit -m "generate updated menu previews"
          git push